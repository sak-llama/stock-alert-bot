name: Stock Swing Trade Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Run Bot Script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: |
          python bot.py
